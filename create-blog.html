<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog - My Blog</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Blog</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-blog.html">Create Blog</a>
        </nav>
    </header>

    <main class="container">

        <div class="form-box">
            <h2>Create a New Blog</h2>

            <form>
                <label>Blog Title</label>
                <input type="text" placeholder="Enter blog title" required>

                <label>Author Name</label>
                <input type="text" placeholder="Enter author name" required>

                <label>Blog Category</label>
                <select required>
                    <option value="">Select category</option>
                    <option>Technology</option>
                    <option>Education</option>
                    <option>Travel</option>
                    <option>Lifestyle</option>
                    <option>Programming</option>
                </select>

                <label>Blog Content</label>
                <textarea rows="8" placeholder="Write your blog here..." required></textarea>

                <button type="submit">Publish Blog</button>
            </form>
        </div>

    </main>

    <footer>
        <p>© 2026 My Blog. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
